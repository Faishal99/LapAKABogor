<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LapAKABogor Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: #f9f9f9;
    }
    .banner {
      background: linear-gradient(90deg, #e63946, #2a9d8f, #f4a261, #264653);
      color: white;
      text-align: center;
      padding: 20px;
    }
    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
    }
    .carousel img {
      width: 100%;
      scroll-snap-align: center;
    }
    .category-title {
      margin-left: 15px;
      font-weight: bold;
      font-size: 18px;
      color: #264653;
    }
    .product {
      background: white;
      margin: 10px;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .cart {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: #2a9d8f;
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
    }
    .checkout-box {
      margin: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 5px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="banner">
    <h1>LapAKABogor</h1>
    <p>Platform dagang UKM & IKM Mahasiswa Politeknik AKA Bogor</p>
  </div>

  <!-- Carousel Produk -->
  <div class="carousel">
    <img src="https://via.placeholder.com/728x300.png?text=Promo+1" alt="Iklan 1">
    <img src="https://via.placeholder.com/728x300.png?text=Promo+2" alt="Iklan 2">
    <img src="https://via.placeholder.com/728x300.png?text=Promo+3" alt="Iklan 3">
  </div>

  <!-- Form Info Pembeli -->
  <div class="checkout-box">
    <input type="text" id="nama" placeholder="Nama Pembeli">
    <input type="text" id="prodi" placeholder="Prodi/Kelas">
    <input type="text" id="nohp" placeholder="Nomor WhatsApp Pembeli">
    <input type="text" id="alamat" placeholder="Alamat (isi jika pengantaran)">
  </div>

  <!-- Kategori Produk -->
  <div id="product-list"></div>

  <!-- Checkout -->
  <div class="checkout-box">
    <label><input type="radio" name="pickup" value="ambil" checked> Ambil Sendiri</label><br>
    <label><input type="radio" name="pickup" value="antar"> Diantar (+Rp1000/item)</label><br><br>
    <label><input type="radio" name="payment" value="QRIS" checked> Pembayaran QRIS</label><br>
    <label><input type="radio" name="payment" value="Cash"> Pembayaran Cash</label><br><br>
    <button onclick="checkout()">Checkout via WhatsApp</button>
  </div>

  <div class="cart" onclick="checkout()">
    <i class="fas fa-shopping-cart"></i> Checkout
  </div>

  <script>
    const products = [
      { id: 1, name: 'Nasi Goreng Spesial', price: 12000, category: 'Makanan Berat' },
      { id: 2, name: 'Keripik Pisang', price: 5000, category: 'Makanan Ringan' },
      { id: 3, name: 'Minuman Herbal', price: 8000, category: 'Minuman' },
      { id: 4, name: 'Reagen Kimia X', price: 30000, category: 'Alat dan Bahan Kimia' },
      { id: 5, name: 'Sabun Organik Mahasiswa', price: 10000, category: 'Produk Inovasi Mahasiswa AKA' },
      { id: 6, name: 'Produk Lainnya', price: 7000, category: 'Lain-lain' }
    ];

    const cart = {};

    function renderProducts() {
      const list = document.getElementById('product-list');
      const categories = [...new Set(products.map(p => p.category))];
      categories.forEach(cat => {
        const title = document.createElement('div');
        title.className = 'category-title';
        title.textContent = cat;
        list.appendChild(title);
        products.filter(p => p.category === cat).forEach(product => {
          const div = document.createElement('div');
          div.className = 'product';
          div.innerHTML = `
            <h3>${product.name}</h3>
            <p>Harga: Rp${product.price}</p>
            <input type="number" min="0" value="0" onchange="updateCart(${product.id}, this.value)">
          `;
          list.appendChild(div);
        });
      });
    }

    function updateCart(id, qty) {
      if (qty > 0) {
        cart[id] = parseInt(qty);
      } else {
        delete cart[id];
      }
    }

    function checkout() {
      const nama = document.getElementById('nama').value;
      const prodi = document.getElementById('prodi').value;
      const nohp = document.getElementById('nohp').value;
      const alamat = document.getElementById('alamat').value;
      const antar = document.querySelector('input[name="pickup"]:checked').value === 'antar';
      const payment = document.querySelector('input[name="payment"]:checked').value;

      if (!nama || !prodi || !nohp) {
        alert('Mohon isi semua data pembeli.');
        return;
      }

      let message = '*Pesanan LapAKABogor:*%0A';
      message += `Nama: ${nama}%0AProdi/Kelas: ${prodi}%0ANo HP: ${nohp}%0A`;
      if (antar) message += `Alamat: ${alamat}%0A`;

      let total = 0;
      Object.keys(cart).forEach(id => {
        const product = products.find(p => p.id == id);
        const qty = cart[id];
        let subtotal = qty * product.price + (antar ? 1000 * qty : 0);
        total += subtotal;
        message += `- ${product.name} x ${qty} = Rp${subtotal}%0A`;
      });

      message += antar ? '%0A*Pengiriman: Diantar*' : '%0A*Pengiriman: Ambil Sendiri*';
      message += `%0A*Metode Pembayaran: ${payment}*`;
      message += `%0A*Total Bayar: Rp${total}*`;

      window.open(`https://wa.me/${nohp}?text=${message}`, '_blank');
    }

    renderProducts();
  </script>
</body>
</html>
