<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LapAKABogor - Toko Online</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Poppins, sans-serif;
      background: #f1f1f1;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #e63946;
      margin-bottom: 5px;
    }
    p.desc {
      text-align: center;
      color: #555;
      margin-top: 0;
    }
    .produk-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .produk {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 200px;
      text-align: center;
    }
    .produk img {
      width: 100%;
      border-radius: 8px;
    }
    .produk h3 {
      margin: 10px 0 5px;
    }
    .produk p {
      color: #777;
      margin: 0 0 10px;
    }
    .produk button {
      background: #2a9d8f;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }
    #keranjang-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #f4a261;
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 18px;
    }
    #keranjang-modal {
      display: none;
      position: fixed;
      top: 70px;
      right: 30px;
      width: 320px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      z-index: 99;
    }
    #keranjang-items {
      max-height: 220px;
      overflow-y: auto;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .checkout-btn {
      background: #e63946;
      color: white;
      padding: 10px;
      text-align: center;
      border-radius: 6px;
      text-decoration: none;
      display: block;
      font-weight: bold;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      color: #555;
    }
    select {
      width: 100%;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

<h1>LapAKABogor</h1>
<p class="desc">Platform dagang UKM Mahasiswa Politeknik AKA Bogor</p>

<div class="produk-container">
  <div class="produk" data-nama="Keripik Pisang" data-harga="10000">
    <img src="https://via.placeholder.com/200" alt="Keripik Pisang">
    <h3>Keripik Pisang</h3>
    <p>Rp10.000</p>
    <button onclick="tambahKeKeranjang(this)">Tambah</button>
  </div>
  <div class="produk" data-nama="Bakpia" data-harga="15000">
    <img src="https://via.placeholder.com/200" alt="Bakpia">
    <h3>Bakpia</h3>
    <p>Rp15.000</p>
    <button onclick="tambahKeKeranjang(this)">Tambah</button>
  </div>
  <div class="produk" data-nama="Gelang Rajut" data-harga="25000">
    <img src="https://via.placeholder.com/200" alt="Gelang Rajut">
    <h3>Gelang Rajut</h3>
    <p>Rp25.000</p>
    <button onclick="tambahKeKeranjang(this)">Tambah</button>
  </div>
</div>

<!-- Tombol Keranjang -->
<button id="keranjang-btn" onclick="toggleKeranjang()">🛒</button>

<!-- Modal Keranjang -->
<div id="keranjang-modal">
  <h3>Keranjang Belanja</h3>
  <div id="keranjang-items"></div>

  <label for="pengiriman">Pilih Metode:</label>
  <select id="pengiriman" onchange="tampilkanKeranjang()">
    <option value="ambil">Ambil Sendiri</option>
    <option value="antar">Diantar (Rp1.000/item)</option>
  </select>

  <p>Total: Rp<span id="total-harga">0</span></p>
  <a id="checkout-link" href="#" class="checkout-btn" target="_blank">Checkout WhatsApp</a>
</div>

<script>
  let keranjang = [];

  function tambahKeKeranjang(button) {
    const produk = button.parentElement;
    const nama = produk.getAttribute('data-nama');
    const harga = parseInt(produk.getAttribute('data-harga'));
    keranjang.push({nama, harga});
    alert(nama + ' ditambahkan ke keranjang!');
    tampilkanKeranjang();
  }

  function toggleKeranjang() {
    const modal = document.getElementById('keranjang-modal');
    modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
  }

  function tampilkanKeranjang() {
    const daftar = document.getElementById('keranjang-items');
    const totalSpan = document.getElementById('total-harga');
    const pengiriman = document.getElementById('pengiriman').value;
    const link = document.getElementById('checkout-link');

    daftar.innerHTML = '';
    let total = 0;
    let biayaAntar = 0;
    let pesan = 'Halo! Saya ingin memesan:%0A';

    keranjang.forEach(item => {
      daftar.innerHTML += `<div>${item.nama} - Rp${item.harga}</div>`;
      total += item.harga;
    });

    if (pengiriman === 'antar') {
      biayaAntar = keranjang.length * 1000;
      pesan += `%0AMetode: Diantar (+Rp1.000 x ${keranjang.length})`;
    } else {
      pesan += `%0AMetode: Ambil Sendiri`;
    }

    const totalBayar = total + biayaAntar;
    pesan += `%0A%0ATotal: Rp${totalBayar}`;
    totalSpan.innerText = totalBayar;
    link.href = `https://wa.me/6289664363463?text=${pesan}`;
  }
</script>

</body>
</html>
