<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LapAKABogor Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: #f9f9f9;
    }
    .banner {
      background: linear-gradient(90deg, #e63946, #2a9d8f, #f4a261, #264653);
      color: white;
      text-align: center;
      padding: 20px;
    }
    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
    }
    .carousel img {
      width: 100%;
      scroll-snap-align: center;
    }
    .category-title {
      margin-left: 15px;
      font-weight: bold;
      font-size: 18px;
      color: #264653;
    }
    .product {
      background: white;
      margin: 10px;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .cart {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: #2a9d8f;
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
    }
    .checkout-box {
      margin: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 5px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="banner">
    <h1>LapAKABogor</h1>
    <p>Platform dagang UKM & IKM Mahasiswa Politeknik AKA Bogor</p>
